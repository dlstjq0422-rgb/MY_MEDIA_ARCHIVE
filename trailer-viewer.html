
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trailer Viewer</title>
<style>
html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#000;
 overflow:hidden;
}
iframe{
 width:100%;
 height:100%;
 border:0;
}
</style>
</head>
<body>
<iframe id="player"
 allow="autoplay; encrypted-media; fullscreen"
 allowfullscreen></iframe>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("v");

if(id){
 document.getElementById("player").src =
 "https://www.youtube.com/embed/" + id;
}
</script>
</body>
</html>
